name: CI

# Mirrors the Jenkins build pipeline (Jenkinsfile) so every change proves the same commands work.
on:
  push:
  pull_request:
    branches: [main]

env:
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  build-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit and endpoint tests (same command as Jenkins, in the .NET SDK container)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e DOTNET_CLI_HOME=/tmp -e NUGET_PACKAGES=/tmp/nuget \
            -v "$PWD":/src -w /src mcr.microsoft.com/dotnet/sdk:8.0 \
            dotnet test tests/AipApi.Tests -c Release \
              --logger "trx;LogFileName=unit-tests.trx" \
              --logger "junit;LogFilePath=/src/TestResults/junit/unit-tests.xml" \
              --collect:"XPlat Code Coverage;Format=cobertura,opencover" \
              --results-directory /src/TestResults
      - name: Check JUnit and coverage reports exist
        run: |
          test -s TestResults/junit/unit-tests.xml
          ls TestResults/*/coverage.opencover.xml TestResults/*/coverage.cobertura.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/

  image:
    name: Docker images and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image for EKS (linux/amd64)
        run: docker build --platform linux/amd64 -t aip-api:ci .
      - name: Build runtime image for Apple Silicon (linux/arm64, cross-compiled)
        run: docker buildx build --platform linux/arm64 -t aip-api:ci-arm64 .
      - name: Build coverage image
        run: docker build --target coverage -t aip-api:coverage .
      - name: Smoke the runtime image
        run: |
          docker run -d --name aip-api -p 8080:8080 aip-api:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs aip-api
          exit 1
      - name: Trivy image scan (same gate as Jenkins)
        run: |
          mkdir -p reports
          TRIVY="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/ -v $PWD/reports:/reports $TRIVY_IMAGE"
          $TRIVY image --no-progress --format json --output /reports/trivy-aip-api.json aip-api:ci
          $TRIVY image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed aip-api:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: reports/

  infra:
    name: Terraform and Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s > /dev/null
