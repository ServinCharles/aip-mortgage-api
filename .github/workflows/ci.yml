name: CI

# Mirrors the Jenkins build pipeline (Jenkinsfile) so every change proves the same commands work.
on:
  push:
  pull_request:
    branches: [main]

env:
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  build-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit and endpoint tests (same command as Jenkins, in the .NET SDK container)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e OWNER="$(id -u):$(id -g)" \
            -v "$PWD":/src -w /src mcr.microsoft.com/dotnet/sdk:8.0 bash -ceu '
              trap "chown -R $OWNER /src" EXIT
              dotnet test tests/AipApi.Tests -c Release \
                --logger "trx;LogFileName=unit-tests.trx" \
                --logger "junit;LogFilePath=/src/TestResults/junit/unit-tests.xml" \
                --collect:"XPlat Code Coverage;Format=cobertura,opencover" \
                --results-directory /src/TestResults
            ' 2>&1 | tee test-output.log
      - name: Show test errors
        if: failure()
        run: grep -iE "error|fail|exception" test-output.log | head -20 | sed 's/^/::error::/'
      - name: Check JUnit and coverage reports exist
        run: |
          test -s TestResults/junit/unit-tests.xml
          ls TestResults/*/coverage.opencover.xml TestResults/*/coverage.cobertura.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/

  image:
    name: Docker images and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image for EKS (linux/amd64)
        run: docker build --platform linux/amd64 -t aip-api:ci .
      - name: Build runtime image for Apple Silicon (linux/arm64, cross-compiled)
        run: docker buildx build --platform linux/arm64 -t aip-api:ci-arm64 .
      - name: Build coverage image
        run: docker build --target coverage -t aip-api:coverage .
      - name: Smoke the runtime image
        run: |
          docker run -d --name aip-api -p 8080:8080 aip-api:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs aip-api
          exit 1
      - name: Smoke with persistence ON (MongoDB + Kafka containers)
        shell: bash
        run: |
          set -euo pipefail
          docker network create aip
          docker run -d --name mongodb --network aip mongo:7.0
          docker run -d --name kafka --network aip \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.8.0
          KT="docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092"
          for attempt in $(seq 1 30); do $KT --list > /dev/null 2>&1 && break; sleep 2; done
          $KT --create --if-not-exists --topic aip.decisions --partitions 3 --replication-factor 1

          docker run -d --name aip-api-persist --network aip -p 8081:8080 \
            -e PERSISTENCE_ENABLED=true \
            -e MONGODB_URI=mongodb://mongodb:27017 \
            -e KAFKA_BOOTSTRAP_SERVERS=kafka:9092 \
            aip-api:ci
          for attempt in $(seq 1 30); do curl -sf http://localhost:8081/health > /dev/null && break; sleep 1; done

          decision="$(curl -sSf -X POST http://localhost:8081/api/mortgages/dip/decision \
            -H 'Content-Type: application/json' -d '{"annualIncome":45000,"loanAmount":150000}')"
          echo "$decision"
          id="$(echo "$decision" | jq -r .applicationId)"
          [[ "$id" =~ ^AIP-[0-9]{8}-[0-9A-F]{8}$ ]] || { echo "::error::Bad applicationId: $id"; exit 1; }

          echo "Saved in MongoDB:"
          curl -sSf "http://localhost:8081/api/applications/$id" | tee application.json
          jq -e '.result.decision == "Accepted" and .input.annualIncome == 45000' application.json

          echo "Published to Kafka:"
          docker exec kafka /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server localhost:9092 \
            --topic aip.decisions --from-beginning --max-messages 1 --timeout-ms 30000 | tee event.json
          jq -e --arg id "$id" '.applicationId == $id and .eventType == "AipDecisionMade" and .schemaVersion == 1' event.json
      - name: Show container logs
        if: failure()
        run: |
          docker logs aip-api-persist 2>&1 | tail -40 || true
          docker logs aip-api-persist 2>&1 | grep -iE "warn|fail|error|exception" | head -10 | sed 's/^/::error::/' || true
      - name: Trivy image scan (same gate as Jenkins)
        run: |
          mkdir -p reports
          TRIVY="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/ -v $PWD/reports:/reports $TRIVY_IMAGE"
          $TRIVY image --no-progress --format json --output /reports/trivy-aip-api.json aip-api:ci
          $TRIVY image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed aip-api:ci
      - name: Summarise vulnerabilities
        if: failure()
        run: |
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | select(.FixedVersion != null and .FixedVersion != "") | "::error title=\(.Severity) \(.VulnerabilityID)::\($t): \(.PkgName) \(.InstalledVersion) -> fix \(.FixedVersion)"' reports/*.json | sort -u | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: reports/